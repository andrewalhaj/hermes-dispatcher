name: gitleaks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # the action lists the PR's commits via the API; the repo's default workflow
    # token is contents-only, so pull_request runs fail without this grant
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
