version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # plugin-react 6 needs Vite 8; revisit when Vite is bumped
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks 5.x only supports eslint up to 9
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
