version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react-hooks 5.x only supports eslint up to 9
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # 7.x adds the React Compiler rules: 27 new lint errors to pay down first
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a config/PostCSS migration, not a bump
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
